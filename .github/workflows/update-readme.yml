name: Update README

on:
  schedule:
    - cron: '*/5 * * * *' # Temporary: runs every 5 minutes for testing
  workflow_dispatch: # Allows you to trigger it manually from the Actions tab

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          
      - name: Update README
        env:
          BURIROR_GH_TOKEN: ${{ secrets.BURIROR_GH_TOKEN }}
        run: php update_readme.php
        
      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m "docs: Auto-update README" || exit 0
          git push
